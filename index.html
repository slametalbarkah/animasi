<!DOCTYPE html>
<html>
<head>
<title>Animasi Kereta Api di Kota Pegunungan</title>
<style>
  body {
    font-family: sans-serif;
    margin: 0;
    overflow: hidden;
    background: linear-gradient(to bottom, #87CEEB, #ADD8E6); /* Langit biru */
  }

  .scene {
    position: relative;
    width: 100%;
    height: 400px; /* Tinggi area animasi */
    background-color: #6B8E23; /* Tanah hijau */
    bottom: 0;
    position: absolute;
  }

  .mountain {
    position: absolute;
    bottom: 100px;
    left: 10%;
    width: 200px;
    height: 150px;
    background-color: #778899; /* Abu-abu gunung */
    border-radius: 50% 50% 0 0;
    transform: skewX(-20deg);
  }

  .mountain:nth-child(2) {
    left: 60%;
    width: 250px;
    height: 180px;
    background-color: #696969;
    border-radius: 60% 60% 0 0;
    transform: skewX(15deg);
  }

  .cloud {
    position: absolute;
    top: 50px;
    left: -100px;
    width: 150px;
    height: 60px;
    background-color: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: moveCloud 30s linear infinite;
  }

  .cloud:nth-child(2) {
    top: 120px;
    left: 30%;
    width: 200px;
    height: 80px;
    animation-delay: 5s;
  }

  .cloud::before {
    content: '';
    position: absolute;
    top: -20px;
    left: 30px;
    width: 80px;
    height: 80px;
    background-color: white;
    border-radius: 50%;
  }

  .cloud::after {
    content: '';
    position: absolute;
    top: -10px;
    left: 80px;
    width: 70px;
    height: 70px;
    background-color: white;
    border-radius: 50%;
  }

  @keyframes moveCloud {
    0% { left: -100px; }
    100% { left: calc(100% + 100px); }
  }

  .helicopter {
    position: absolute;
    top: 80px;
    left: 50%;
    font-size: 2em;
    color: #007bff;
    animation: flyHelicopter 10s ease-in-out infinite alternate;
  }

  @keyframes flyHelicopter {
    0% { transform: translateX(-50px) translateY(0) rotate(-10deg); }
    50% { transform: translateX(50px) translateY(-20px) rotate(10deg); }
    100% { transform: translateX(-50px) translateY(0) rotate(-10deg); }
  }

  .bird {
    position: absolute;
    top: 150px;
    left: -50px;
    font-size: 1.5em;
    color: #333;
    animation: flyBird 8s linear infinite;
  }

  .bird:nth-child(2) {
    top: 180px;
    left: 80%;
    animation-delay: 2s;
    animation-duration: 10s;
  }

  @keyframes flyBird {
    0% { left: -50px; transform: rotate(30deg); }
    50% { transform: rotate(-30deg); }
    100% { left: calc(100% + 50px); transform: rotate(30deg); }
  }

  /* Elemen yang sudah ada (jalan, kereta, lampu, gedung) */
  .road {
    position: absolute;
    top: 60%; /* Turunkan jalan agar gunung terlihat */
    left: 0;
    width: 100%;
    height: 80px; /* Sesuaikan tinggi jalan */
    background-color: #444;
    border-top: 5px dashed yellow;
    border-bottom: 5px dashed yellow;
  }

  .train {
    position: absolute;
    bottom: 85px; /* Sesuaikan posisi kereta */
    left: -200px;
    font-size: 2em;
    color: #feca57;
    animation: moveTrain 15s linear infinite;
  }

  .traffic-light {
    position: absolute;
    bottom: 185px; /* Sesuaikan posisi lampu */
    left: 30%;
    width: 30px;
    height: 70px;
    background-color: #222;
    border-radius: 5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-around;
    padding: 5px 0;
  }

  .light {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background-color: #333;
  }

  .light.red { background-color: red; }
  .light.yellow { background-color: yellow; }
  .light.green { background-color: green; }

  .traffic-light.cycle .light { background-color: #333; }
  .traffic-light.cycle .red { animation: redLight 5s infinite; }
  .traffic-light.cycle .yellow { animation: yellowLight 5s infinite 2s; }
  .traffic-light.cycle .green { animation: greenLight 5s infinite 3s; }

  @keyframes redLight {
    0%, 30% { background-color: red; }
    31%, 100% { background-color: #333; }
  }

  @keyframes yellowLight {
    0%, 20%, 50% { background-color: #333; }
    21%, 49%, 80% { background-color: yellow; }
    81%, 100% { background-color: #333; }
  }

  @keyframes greenLight {
    0%, 40%, 70% { background-color: #333; }
    41%, 69%, 100% { background-color: green; }
  }

  .building {
    position: absolute;
    bottom: 170px; /* Sesuaikan posisi gedung */
    background-color: #888;
    color: #eee;
    text-align: center;
    border-radius: 5px 5px 0 0;
    box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
  }

  .building:nth-child(1) {
    left: 15%;
    width: 70px;
    height: 130px;
  }

  .building:nth-child(2) {
    left: 55%;
    width: 110px;
    height: 180px;
    transform: translateX(-50%);
  }

  .building:nth-child(3) {
    left: 85%;
    width: 50px;
    height: 90px;
  }
</style>
</head>
<body>

  <div class="scene">
    <div class="mountain"></div>
    <div class="mountain"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="helicopter">🚁</div>
    <div class="bird">🐦</div>
    <div class="bird">🕊️</div>
    <div class="road"></div>
    <div class="train">🚂<span class="train-carriage">🚃</span><span class="train-carriage">🚃</span></div>
    <div class="traffic-light cycle">
      <div class="light red"></div>
      <div class="light yellow"></div>
      <div class="light green"></div>
    </div>
    <div class="building">Gedung A</div>
    <div class="building">Gedung B</div>
    <div class="building">Gedung C</div>
  </div>

</body>
</html>
